services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rolefit
      POSTGRES_PASSWORD: rolefit
      POSTGRES_DB: rolefit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolefit"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rolefit:rolefit@db:5432/rolefit
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
